name: Nightly Docker Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-docker-release
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for new commits since last release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare HEAD against last successful nightly release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_sha=$(gh run list \
            --workflow "nightly-docker-release.yml" \
            --status success \
            --branch "${{ github.ref_name }}" \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha')

          if [ -z "$last_sha" ]; then
            echo "No previous successful run found; building." >&2
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$last_sha" = "$(git rev-parse HEAD)" ]; then
            echo "No new commits since the last successful nightly release." >&2
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found since $last_sha." >&2
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and push nightly image
    needs: check-changes
    if: needs.check-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:nightly-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
