name: Code quality

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.3"
  OTP_VERSION: "28.5"

jobs:
  compile:
    name: Compile (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix check.compile

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix check.format

  credo:
    name: Credo (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix credo --strict

  ast-grep:
    name: ast-grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @ast-grep/cli
      - run: ast-grep scan

  restdis:
    name: restdis (check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/restdis
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            apps/restdis/deps
            apps/restdis/_build
          key: ${{ runner.os }}-restdis-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/restdis/mix.lock') }}
          restore-keys: ${{ runner.os }}-restdis-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix check
      - run: mix coveralls --minimum-coverage 95

  coverage:
    name: Umbrella coverage
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      # Started with `docker run`, not the `services:` block, because
      # restdis_buster's WAL tailer needs a real logical replication slot
      # (`wal_level=logical`), which `services:` has no way to pass to the
      # Postgres entrypoint. Mirrors `docker-compose.yml`'s `db` service.
      - name: Start Postgres (wal_level=logical)
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_INITDB_ARGS="--locale=C.UTF-8" \
            -p 5432:5432 \
            postgres:16 postgres -c wal_level=logical
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "Postgres never became healthy" >&2
          docker logs pg >&2
          exit 1
      - run: mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      # Each umbrella app is measured with its own `mix coveralls` invocation
      # (excoveralls only reports a single sub-app's table when given
      # multiple test paths at once). `apps/restdis` is deliberately excluded
      # here: it is tested independently, with its own deps/mix.lock, by the
      # `restdis` job above. `--minimum-coverage 95` fails the job (and thus
      # CI) if any app's coverage drops below 95%, regardless of the
      # `coveralls.json` default.
      - run: mix coveralls apps/restdis_repo/test --minimum-coverage 95
      - run: mix coveralls apps/restdis_replicator/test --minimum-coverage 95
      - run: mix coveralls apps/restdis_electric/test --minimum-coverage 95
      - run: mix coveralls apps/restdis_server/test --minimum-coverage 95
      - run: mix coveralls apps/restdis_buster/test --minimum-coverage 95
