########################################################################
# Demo Supabase stack for exercising Restdis against real Supabase
# integration points (PostgREST, GoTrue) rather than a hand-rolled stub.
#
# Not a substitute for `docker-compose.yml` at the repo root, which is for
# local development against a bare Postgres. This stack is only for the
# integration suite in `demo/tests` and the "Supabase integration" CI
# workflow.
########################################################################

services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Real PostgREST, the same origin Restdis's PGRST.QUERY path caches in
  # production, pointed at the `public` schema the seed creates.
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
    ports:
      - "3000:3000"

  # Real GoTrue, standing in for the Supabase Auth integration point
  # (SUPABASE_INTEGRATION_PRD.md, Auth user-data caching).
  auth:
    image: supabase/gotrue:v2.170.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:9999
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_JWT_SECRET: demo-supabase-jwt-secret-demo-supabase-jwt-secret
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "false"
    ports:
      - "9999:9999"

  restdis:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/postgres
      RELEASE_COOKIE: restdis_demo_cookie
      RELEASE_AZ: local
      HTTP_PORT: "4040"
      RESP_PORT: "6380"
    ports:
      - "4041:4040"
      - "6381:6380"
