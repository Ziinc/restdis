services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restdis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  restdis:
    build: .
    profiles: ["release"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/restdis_dev
      RELEASE_COOKIE: restdis_local_cookie
      RELEASE_AZ: local
      HTTP_PORT: "4040"
      RESP_PORT: "6380"
    ports:
      - "4040:4040"
      - "6380:6380"
    volumes:
      - cache_data:/var/lib/restdis/cache

  # Interactive dev server: runs the umbrella app under `mix` (not the
  # release built by the production Dockerfile) so source changes on the
  # host are picked up without rebuilding an image, and `mix test`/`mix
  # check`/`iex` are available. Use this instead of `restdis` for local
  # development; use `restdis` to exercise the production release build.
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "mix deps.get && mix run --no-halt"
    environment:
      MIX_ENV: dev
      POSTGRES_HOSTNAME: db
      RESP_LISTEN_IP: "0.0.0.0"
    ports:
      - "6380:6380"
      - "4040:4040"
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
      - mix_home:/root/.mix
      - hex_home:/root/.hex
    depends_on:
      db:
        condition: service_healthy

volumes:
  cache_data:
  postgres_data:
  mix_deps:
  mix_build:
  mix_home:
  hex_home:
