services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supa_cacher_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  supacacher:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/supa_cacher_dev
      RELEASE_COOKIE: supacacher_local_cookie
      RELEASE_AZ: local
      HTTP_PORT: "4040"
      RESP_PORT: "6380"
    ports:
      - "4040:4040"
      - "6380:6380"
    volumes:
      - cache_data:/var/lib/supacacher/cache

volumes:
  cache_data:
