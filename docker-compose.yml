services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supa_cacher_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supa_cacher_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "mix deps.get && mix run --no-halt"
    environment:
      MIX_ENV: dev
      POSTGRES_HOSTNAME: postgres
    ports:
      - "6380:6380"
      - "4040:4040"
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
      - mix_home:/root/.mix
      - hex_home:/root/.hex
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mix_deps:
  mix_build:
  mix_home:
  hex_home:
