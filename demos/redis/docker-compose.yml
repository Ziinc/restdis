########################################################################
# Lightweight stack for the RESP-protocol demo: Postgres + PostgREST +
# Restdis, no GoTrue/Prometheus/Grafana. `demos/redis/demo.sh` only drives
# the Redis wire protocol (AUTH, GET/SET, PGRST.QUERY/PGRST.POLICY, PERSIST)
# and never touches Auth or the dashboard, so this stack skips them rather
# than reusing `demos/supabase/docker-compose.yml` wholesale.
#
# Not a substitute for `docker-compose.yml` at the repo root, which is for
# local development against a bare Postgres.
########################################################################

services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Real PostgREST, the origin Restdis's PGRST.QUERY path caches.
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
    ports:
      - "3000:3000"

  restdis:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/postgres
      RELEASE_COOKIE: restdis_demo_cookie
      RELEASE_AZ: local
      HTTP_PORT: "4040"
      RESP_PORT: "6380"
    ports:
      - "4041:4040"
      - "6381:6380"
