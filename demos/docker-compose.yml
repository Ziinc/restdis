########################################################################
# Demo Supabase stack for exercising Restdis against real Supabase
# integration points (PostgREST, GoTrue) rather than a hand-rolled stub.
#
# Not a substitute for `docker-compose.yml` at the repo root, which is for
# local development against a bare Postgres. This stack is only for the
# integration suite in `demos/tests` and the "Supabase integration" CI
# workflow.
########################################################################

services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Real PostgREST, the same origin Restdis's PGRST.QUERY path caches in
  # production, pointed at the `public` schema the seed creates.
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
    ports:
      - "3000:3000"

  # Real GoTrue, standing in for the Supabase Auth integration point
  # (SUPABASE_INTEGRATION_PRD.md, Auth user-data caching).
  auth:
    image: supabase/gotrue:v2.170.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:9999
      # GoTrue's envconfig tag for this field is the bare "API_EXTERNAL_URL",
      # not "GOTRUE_API_EXTERNAL_URL" - confirmed by extracting the binary's
      # struct tags (`envconfig:"API_EXTERNAL_URL"`) and testing directly.
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_JWT_SECRET: demo-supabase-jwt-secret-demo-supabase-jwt-secret
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "false"
    ports:
      - "9999:9999"

  restdis:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/postgres
      RELEASE_COOKIE: restdis_demo_cookie
      RELEASE_AZ: local
      HTTP_PORT: "4040"
      RESP_PORT: "6380"
    ports:
      - "4041:4040"
      - "6381:6380"

  # Scrapes Restdis's /metrics endpoint on a fast interval so the Grafana
  # dashboard reacts quickly enough to be watched live during the demo.
  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - restdis
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Single-page dashboard (grafana/dashboards/restdis-demo.json) provisioned
  # automatically on boot - open http://localhost:3001 alongside a terminal
  # running demos/scripts/demo.sh.
  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DEFAULT_APP_MODE: development
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
