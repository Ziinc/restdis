########################################################################
# Stack for the recorded demos in demos/videos: Postgres + PostgREST +
# Restdis. Postgres logs every statement (log_statement=all) so the videos
# can show, next to each client, which reads actually reach the database.
#
# Ports are offset from the root docker-compose.yml and the other demo
# stacks so this one can run alongside them.
########################################################################

services:
  db:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - log_statement=all
      - -c
      - log_line_prefix=%m [%a] 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres?application_name=postgrest
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
    ports:
      - "3002:3000"

  restdis:
    image: ${RESTDIS_IMAGE:-restdis:demo}
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      RESTDIS_DATABASE_URL: ecto://postgres:postgres@db/postgres
      RELEASE_COOKIE: restdis_demo_cookie
      RESTDIS_RELEASE_AZ: local
      RESTDIS_HTTP_PORT: "4040"
      RESTDIS_RESP_PORT: "6380"
    ports:
      - "4042:4040"
      - "6382:6380"
